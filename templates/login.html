<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل دخول المسؤول</title><style>body{background:#0b1020;color:#e9f1fc;min-height:100vh;display:grid;place-items:center;font:15px system-ui}form{padding:30px;background:#172339;border:1px solid #2b3d5b;border-radius:15px;width:min(350px,90vw)}input,button{width:100%;padding:12px;margin-top:12px;border-radius:8px;box-sizing:border-box;font:inherit}input{background:#091426;color:white;border:1px solid #355075}button{background:#307dec;color:white;border:none;cursor:pointer}.error{color:#ff8585}</style>
</head><body><form method="post"><h2>لوحة إدارة الموقع</h2><p>الدخول للمسؤول فقط</p><p class="error">{{ err }}</p><input type="password" name="p" autocomplete="current-password" placeholder="كلمة المرور" required autofocus><button type="submit">دخول</button></form></body></html>
